version: 2

updates:
  # kong gateway — pinned base image (kong:3.9.1)
  - package-ecosystem: "docker"
    directory: "/kong"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      patch-minor:
        update-types:
          - "patch"
          - "minor"

  # postgres — pinned Supabase base image (supabase/postgres:15.8.1.085)
  - package-ecosystem: "docker"
    directory: "/postgres"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      patch-minor:
        update-types:
          - "patch"
          - "minor"
